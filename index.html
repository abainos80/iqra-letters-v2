<style>

    --sky1:#bfe3f5;--sky2:#e9f4d8;--grass:#cfe6a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

  .baur{width:76px;height:70px;flex-shrink:0;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;

  .label{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 14px;box-shadow:0 3px 10px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px}

  .hintbtn{background:#fff;border:1px dashed var(--pp2);color:var(--pp2);border-radius:12px;padding:9px;width:100%;font-size:13px;cursor:pointer;margin-bottom:12px}

  .micbtn{width:104px;height:104px;border-radius:50%;background:var(--pp);border:none;color:#fff;font-size:38px;cursor:pointer;margin:10px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(91,67,230,.5)}

  .chip.used{opacity:.25;pointer-events:none}.chip.inbuild{background:#f3f0ff;border-color:var(--pp)}

  .fb{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;width:354px;max-width:92%;border-radius:14px;padding:14px 18px;font-weight:800;font-size:15px;display:none;z-index:30;align-items:center;gap:10px}

  .dhead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center}

  .msg{display:flex;gap:10px;margin-bottom:12px;align-items:flex-end}.msg.me{flex-direction:row-reverse}
  .msg .a{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#b9a6ff,#7d6bff);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px}.msg.me .a{background:#2fa86a}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:11px 15px;color:var(--ink);font-size:15px;max-width:76%}.msg.me .bubble{background:var(--pp);color:#fff;border:none;border-radius:16px 16px 4px 16px}
  .steptag{text-align:center;color:var(--muted);font-size:11px;margin:6px 0 12px}
  .done{text-align:center;padding:50px 30px}.done .big{font-size:60px}.done h2{color:var(--ink);font-size:24px;margin:14px 0 6px}.done p{color:var(--muted);font-size:14px;margin-bottom:22px}
  .badge{display:inline-block;background:#fff;border:2px solid var(--gold);border-radius:14px;padding:12px 20px;color:var(--gold);font-weight:800;margin-bottom:22px}
  .eximg{width:150px;height:150px;object-fit:contain;margin:6px auto 12px;display:block;border-radius:16px}
  .imgph{width:150px;height:150px;margin:6px auto 12px;border:2px dashed #c9bfe8;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9a8fc8;font-size:28px;text-align:center;background:#f7f5ff}
  .imgph small{font-size:9px;color:#b0a5d5;margin-top:4px;word-break:break-all;padding:0 6px}
  .videobox .vidph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:#2a2140;font-size:28px}
  .videobox .vidph small{font-size:11px;opacity:.7;margin-top:6px}
  .videobox video{width:100%;height:100%;object-fit:cover;background:#000}
  .songcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .songcard .cover{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#b9a6ff,#7d6bff);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .songcard b{color:var(--ink);font-size:15px;display:block}.songcard span{color:var(--muted);font-size:12px}
  .playerbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
  .playerbar .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .playerbar .cover{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#b9a6ff,#7d6bff);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .playerbar .info b{display:block;color:var(--ink);font-size:15px}.playerbar .info span{color:var(--muted);font-size:12px}
  .playbtn2{width:44px;height:44px;border-radius:50%;background:var(--pp);color:#fff;border:none;font-size:18px;cursor:pointer;margin-left:auto}

  .timerow{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
  .lyricbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}

  .lyricline .kz{color:var(--muted);font-size:15px}
  .lyricline .ru{color:#b5aed0;font-size:12px;margin-top:2px}
  .lyricline.active .kz{color:var(--pp);font-weight:800;font-size:17px}
  .lyricline.active .ru{color:var(--muted)}
  .gamecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer}
  .gamecard .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:#fff}
  .gamecard b{color:var(--ink);font-size:15px;display:block}.gamecard span{color:var(--muted);font-size:12px}
  .wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:280px;margin:0 auto 16px}
  .wtile{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--ink);background:#fff}
  .wtile.g{background:var(--ok);border-color:var(--ok);color:#fff}.wtile.y{background:#e8b93d;border-color:#e8b93d;color:#fff}.wtile.gr{background:#c7c2d6;border-color:#c7c2d6;color:#fff}

  .wkey{min-width:26px;height:38px;padding:0 6px;border-radius:6px;border:none;background:#e8e4f5;color:var(--ink);font-size:12px;font-weight:700;cursor:pointer}

  .matchgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .mcard.wrong{border-color:var(--err) !important;background:#fdeaef !important}
  .flashcard{border-radius:22px;padding:36px 20px;text-align:center;margin-bottom:16px;box-shadow:0 10px 28px rgba(91,67,230,.25)}

  .flashcard .fc-sub{color:rgba(255,255,255,.85);font-size:12px;margin-top:8px;text-transform:uppercase;letter-spacing:.5px}

<script>
/* ⚠️ Казахский — ЧЕРНОВИК под лингвиста.
   Раздел: специфичные буквы казахского (Дыбыстар). 7 печенек, двухтактовая структура. */

// 9 спецбукв + базовое слово-пример (буква для подсветки)
const LETTERS=[
 {L:"Ә ә",tr:"[ä]",word:"Әже",hl:"Ә",ru:"бабушка",img:"img/word-aje.png",audioL:"audio/letter-a.mp3.mp3",audioW:"audio/word-aje.mp3.mp3"},
 {L:"Ғ ғ",tr:"[ğ]",word:"Ғалым",hl:"Ғ",ru:"учёный",img:"img/word-galym.png",audioL:"audio/letter-gh.mp3.mp3",audioW:"audio/word-galym.mp3.mp3"},
 {L:"Қ қ",tr:"[q]",word:"Қар",hl:"Қ",ru:"снег",img:"img/word-qar.png",audioL:"audio/letter-q.mp3.mp3",audioW:"audio/word-qar.mp3.mp3"},
 {L:"Ң ң",tr:"[ŋ]",word:"Таң",hl:"ң",ru:"рассвет",img:"img/word-tan.png",audioL:"audio/letter-ng.mp3.mp3",audioW:"audio/word-tan.mp3.mp3"},
 {L:"Ө ө",tr:"[ö]",word:"Өзен",hl:"Ө",ru:"река",img:"img/word-ozen.png",audioL:"audio/letter-o.mp3.mp3",audioW:"audio/word-ozen.mp3.mp3"},
 {L:"Ұ ұ",tr:"[ū]",word:"Ұл",hl:"Ұ",ru:"сын",img:"img/word-ul.png",audioL:"audio/letter-u.mp3.mp3",audioW:"audio/word-ul.mp3.mp3"},
 {L:"Ү ү",tr:"[ü]",word:"Үй",hl:"Ү",ru:"дом",img:"img/word-uy.png",audioL:"audio/letter-ue.mp3.mp3",audioW:"audio/word-uy.mp3.mp3"},
 {L:"Һ һ",tr:"[h]",word:"Һәм",hl:"Һ",ru:"и (книжн.)",img:"",audioL:"audio/letter-h.mp3.mp3",audioW:"audio/word-ham.mp3.mp3"},
 {L:"І і",tr:"[ı]",word:"Іні",hl:"І",ru:"младший брат",img:"img/word-ini.png",audioL:"audio/letter-i.mp3.mp3",audioW:"audio/word-ini.mp3.mp3"},

 {kz:"Әже",ru:"бабушка"},{kz:"Үй",ru:"дом"},{kz:"Қар",ru:"снег"},
 {kz:"Өзен",ru:"река"},{kz:"Ұл",ru:"сын"},{kz:"Іні",ru:"младший брат"},
 {kz:"Сәлем",ru:"привет"},{kz:"Рахмет",ru:"спасибо"},
];

const B=[
 {n:1,tk:1,icon:"▶️",title:"Видео",sub:"Дыбыстар · объяснение звуков",kind:"video"},
 {n:2,tk:1,icon:"🃏",title:"Слово",sub:"9 спецбукв + примеры",kind:"letters"},
 {n:3,tk:1,icon:"🎤",title:"Шэдоуинг",sub:"повторяй за персонажем",kind:"shadow"},

 {n:6,tk:2,icon:"✏️",title:"Тренировка",sub:"сложнее",kind:"train2"},
 {n:7,tk:3,icon:"🗣️",title:"Разговор",sub:"с Айбарысом",kind:"dialog"},
];

const screen=document.getElementById('screen');
// картинка: если путь задан — показываем <img>, иначе рамку-заглушку с именем файла
function pic(src,alt,cls){
  if(!src) return '';
  return `<img src="${src}" alt="${alt||''}" class="${cls||'eximg'}" onerror="this.outerHTML='<div class=\'imgph\'>🖼️<br><small>'+this.alt+'<br>'+this.src+'</small></div>'">`;
}
let done=[];
function fb(ok,t){const el=document.getElementById('fb');el.className='fb '+(ok?'ok':'no');el.textContent=(ok?'✓ ':'✗ ')+t;clearTimeout(el._t);el._t=setTimeout(()=>el.className='fb',1400);}
function playAudio(src,label){
  if(src){try{const a=new Audio(src);a.play().catch(()=>fb(true,'🔊 '+label+' (файл: '+src+')'));}catch(e){fb(true,'🔊 '+label);}}
  else fb(true,'🔊 '+label);
}
function isNext(n){for(const b of B){if(!done.includes(b.n))return b.n===n;}return false;}

function renderMap(){
  let html=`<div class="maptop">
     <div class="coin"><span class="c">🪙</span>100<span class="plus">+</span></div>
     <div class="modpill">✦ Модуль 1 · Апта 1 ✦</div>
     <div class="ava">🐱</div></div>
   <div class="maptitle">Дыбыстар — звуки</div>
   <div class="mapsub">Специфичные буквы казахского языка</div>
   <div class="note">⚠️ Казахский текст — черновик для прототипа. Буквы, слова и произношение выверяет лингвист.</div>
   <div class="trail">`;
  let curtk=0;
  B.forEach(b=>{
    if(b.tk!==curtk){curtk=b.tk;html+=`<div class="takthdr">${b.tk===1?'Такт 1 · Узнал':(b.tk===2?'Такт 2 · Подготовился':'Такт 3 · Использовал')}</div>`;}
    const d=done.includes(b.n),cur=!d&&isNext(b.n);
    const cls=d?'done':(cur?'cur':(isNext(b.n)?'':'')); 
    const stars=d?'<div class="stars">⭐⭐⭐</div>':'';
    html+=`<div class="node ${d?'done':(cur?'cur':'')}" onclick="openB(${b.n})">
      <div class="baur"><span class="num">${b.n}</span>${b.icon}${stars}</div>
      <div class="label"><div class="ic">${b.icon}</div><div><b>${b.title}</b><span>${b.sub}</span></div></div>
     </div>`;
  });
  html+=`</div>`;
  screen.innerHTML=html; screen.scrollTop=0;
}
function openB(n){
  const b=B.find(x=>x.n===n);
  ({video:vVideo,letters:vLetters,shadow:vShadow,assemble:vAssemble,train1:vTrain1,train2:vTrain2,dialog:vDialog}[b.kind])();
}
function head(cur,total){return `<div class="exhead"><button class="back" onclick="renderMap()">‹</button><div class="pg"><div class="fill" style="width:${cur/total*100}%"></div></div><span class="hearts">♥ 5</span></div>`;}
function complete(n,last){
  if(!done.includes(n))done.push(n);
  screen.innerHTML=`<div class="exhead"><button class="back" onclick="renderMap()">‹</button><div class="pg"><div class="fill" style="width:100%"></div></div></div>
   <div class="done"><div class="big">🍪</div><h2>${last?'Раздел пройден! 🎉':'Баурсак пройден!'}</h2>
   <p>${last?'Ты знаешь 9 казахских букв и умеешь их произносить':'+15 XP · отличная работа'}</p>
   <div class="badge">🔥 Стрик продолжается</div></div>
   <div class="foot"><button class="btn primary" onclick="renderMap()">Вернуться на карту</button></div>`;
}

/* 3 ШЭДОУИНГ — повтори за персонажем (буквы→слова→сам перевод) */
function vShadow(){
  // градация: сначала буквы, потом слова, потом «скажи сам по переводу»
  const items=[
   {say:"Ә",ru:"буква Ә",mode:"repeat"},
   {say:"Қ",ru:"буква Қ",mode:"repeat"},
   {say:"Ү",ru:"буква Ү",mode:"repeat"},
   {say:"Әже",ru:"бабушка",mode:"repeat"},
   {say:"Үй",ru:"дом",mode:"repeat"},
   {say:"Қар",ru:"снег",mode:"repeat"},
   {say:"Өзен",ru:"река",mode:"recall"},   // вспомни и скажи сам
   {say:"Сәлем",ru:"привет",mode:"recall"},
  ];
  let i=0,rec=false;
  function draw(){const e=items[i];const recall=e.mode==='recall';
    screen.innerHTML=head(i+1,items.length)+`<div class="body">
     <div class="qtag">Такт 1 · Узнал · шэдоуинг ${i+1}/${items.length}</div>
     <div class="qtext">${recall?'Вспомни и скажи сам':'Повтори за Айбарысом'}</div>
     <div class="qhint">${recall?'Как будет «'+e.ru+'»? Скажи вслух.':'Слушай и повтори вслух — буква, потом слово.'}</div>
     ${recall?'':`<button class="playbtn" onclick="fb(true,'🔊 ${e.say}')">🔊</button>`}
     <div class="card letterbig">${recall?`<div class="tr" style="font-size:18px">«${e.ru}»</div><div style="color:var(--muted);font-size:13px;margin-top:6px">скажи по-казахски</div>`:`<div class="L" style="font-size:${e.say.length>2?'40px':'56px'}">${e.say}</div><div class="tr">${e.ru}</div>`}</div>
     <button class="micbtn" id="mic" onclick="rc()">🎤</button><div class="wave" id="wv">нажми и скажи</div>
     </div><div class="foot"><button class="btn primary" id="ck" onclick="nx()" disabled>Айттым ✓</button></div>`;
    screen.scrollTop=0;rec=false;}
  window.rc=()=>{document.getElementById('wv').textContent='▁▂▄▆█▆▄▂▁ запись… (распознавание — заглушка)';document.getElementById('mic').style.background='#e0466a';document.getElementById('ck').disabled=false;};
  window.nx=()=>{fb(true,'Жарайсың!');i<items.length-1?(i++,draw()):complete(3);};
  draw();
}

/* 4 СОБЕРИ СЛОВО по аудио (из букв) */
function vAssemble(){
  const list=[
   {word:"Әже",bank:["Ә","ж","е","қ","ы"],a:["Ә","ж","е"]},
   {word:"Үй",bank:["Ү","й","о","л"],a:["Ү","й"]},
   {word:"Қар",bank:["Қ","а","р","ә","н"],a:["Қ","а","р"]},
   {word:"Өзен",bank:["Ө","з","е","н","ұ"],a:["Ө","з","е","н"]},
   {word:"Ұл",bank:["Ұ","л","і","қ"],a:["Ұ","л"]},
   {word:"Іні",bank:["І","н","і","ө","т"],a:["І","н","і"]},
   {word:"Сәлем",bank:["С","ә","л","е","м","қ"],a:["С","ә","л","е","м"]},
   {word:"Рахмет",bank:["Р","а","х","м","е","т","ң"],a:["Р","а","х","м","е","т"]},
  ];
  let i=0,ans=false,build=[];
  function draw(){const e=list[i];
    screen.innerHTML=head(i+1,list.length)+`<div class="body"><div class="qtag">Такт 1 · Узнал · собери слово ${i+1}/${list.length}</div>
     <div class="qtext">Собери слово, которое слышишь</div>
     <button class="playbtn" onclick="fb(true,'🔊 ${e.word}')">🔊</button><div class="wave">нажми, чтобы прослушать</div>
     <div class="builder" id="bd"></div><div class="bank">${e.bank.map((c,k)=>`<button class="chip" id="c${k}" onclick="tb(${k})">${c}</button>`).join('')}</div>
     </div><div class="foot"><button class="btn primary" id="ck" onclick="ck()" disabled>Тексеру</button></div>`;
    screen.scrollTop=0;ans=false;build=[];}
  window.tb=k=>{if(ans)return;const e=list[i],c=document.getElementById('c'+k);if(c.classList.contains('used'))return;c.classList.add('used');build.push({k,w:e.bank[k]});rb();document.getElementById('ck').disabled=!build.length;};
  window.ub=p=>{if(ans)return;document.getElementById('c'+build[p].k).classList.remove('used');build.splice(p,1);rb();document.getElementById('ck').disabled=!build.length;};
  function rb(){document.getElementById('bd').innerHTML=build.map((x,p)=>`<button class="chip inbuild" onclick="ub(${p})">${x.w}</button>`).join('');}
  window.ck=()=>{if(ans){i<list.length-1?(i++,draw()):complete(4);return;}const e=list[i],ok=JSON.stringify(build.map(x=>x.w))===JSON.stringify(e.a);ans=true;fb(ok,ok?'Дұрыс!':'Правильно: '+e.a.join(''));document.getElementById('ck').textContent=i<list.length-1?'Әрі қарай →':'Завершить ✓';};
  draw();
}

/* универсальный движок выбора с градацией и подсказками + отработка ошибок */
function choiceSet(n,list,label,last){
  let i=0,ans=false,sel=null,wrong=[],phase='main';
  const cur=()=>phase==='main'?list[i]:wrong[i];const tot=()=>phase==='main'?list.length:wrong.length;
  const diff=k=>k<2?'лёгкое':(k<5?'базовое':'сложное');
  function draw(){const e=cur();const showH=phase==='main'&&i<5;
    screen.innerHTML=head(i+1,tot())+`<div class="body"><div class="qtag">${phase==='err'?'Работа над ошибками':label+' · '+diff(i)}</div>
     <div class="qtext">${e.q}</div>${e.big?`<div class="card letterbig"><div class="L" style="font-size:${e.big.length>2?'40px':'56px'}">${e.big}</div></div>`:''}
     ${showH?`<button class="hintbtn" id="hb" onclick="sh()">💡 Подсказка</button><div id="hbx"></div>`:''}
     ${e.options.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pk(${k})">${o}<span class="mark"></span></button>`).join('')}
     </div><div class="foot"><button class="btn primary" id="ck" onclick="ck()" disabled>Тексеру</button></div>`;
    screen.scrollTop=0;ans=false;sel=null;}
  window.sh=()=>{document.getElementById('hbx').innerHTML=`<div class="hintbox">💡 ${cur().hint||'Вспомни звучание буквы'}</div>`;document.getElementById('hb').style.display='none';};
  window.pk=k=>{if(ans)return;sel=k;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));document.querySelector('.opt[data-k="'+k+'"]').classList.add('sel');document.getElementById('ck').disabled=false;};
  window.ck=()=>{if(ans){if(i<tot()-1){i++;draw();}else if(phase==='main'&&wrong.length){phase='err';i=0;fb(true,'Разберём ошибки');draw();}else complete(n,last);return;}
    const e=cur(),ok=sel===e.a;document.querySelectorAll('.opt').forEach(o=>{const k=+o.dataset.k;if(k===e.a)o.classList.add('correct');if(k===sel&&!ok)o.classList.add('wrong');});
    if(!ok&&phase==='main')wrong.push(e);ans=true;fb(ok,ok?'Дұрыс!':'Верный ответ подсвечен');
    const fin=(i===tot()-1)&&!(phase==='main'&&wrong.length);document.getElementById('ck').textContent=fin?(last?'Завершить ✓':'Завершить ✓'):'Әрі қарай →';};
  draw();
}

/* 7 РАЗГОВОР С АЙБАРЫСОМ */
function vDialog(){
  const list=[
   {step:"Выбор · 1",b:"Сәлем! Қазақ әріптерін үйрендің бе?",pr:"Ответь «да, выучил»",k:"c",o:["Иә, үйрендім","Жоқ","Қар"],a:0},
   {step:"Выбор · 2",b:"«Әже» деген не?",pr:"Что значит «Әже»?",k:"c",o:["бабушка","дом","снег"],a:0},
   {step:"Собери · 3",b:"«Дом» — қалай айтамыз?",pr:"Собери слово «дом»",k:"as",bank:["Ү","й","о"],a:["Ү","й"]},
   {step:"Речь · 4",b:"Маған бір әріпті дауыстап айт.",pr:"Скажи вслух любую букву, например «Қ»",k:"s",t:"Қ"},
   {step:"Речь · 5",b:"Керемет! «Рахмет» деп айтшы.",pr:"Скажи вслух «Рахмет»",k:"s",t:"Рахмет"},
   {step:"Речь · 6",b:"Жарайсың! Сау бол!",pr:"Попрощайся вслух: «Сау бол!»",k:"s",t:"Сау бол!"},
  ];
  let i=0,ans=false,sel=null,build=[],hist=[];
  function draw(){const e=list[i];
    let h=hist.map(x=>`<div class="msg ${x.me?'me':''}"><div class="a">${x.me?'🧑':'🐱'}</div><div class="bubble">${x.t}</div></div>`).join('');
    let body='';
    if(e.k==='c')body=e.o.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pk(${k})">${o}<span class="mark"></span></button>`).join('');
    else if(e.k==='as')body=`<div class="builder" id="bd"></div><div class="bank">${e.bank.map((c,k)=>`<button class="chip" id="c${k}" onclick="tb(${k})">${c}</button>`).join('')}</div>`;
    else body=`<button class="micbtn" id="mic" onclick="rc()">🎤</button><div class="wave" id="wv">нажми и скажи</div><div class="card letterbig"><div class="L" style="font-size:${e.t.length>3?'32px':'52px'}">${e.t}</div></div>`;
    screen.innerHTML=head(i+1,list.length)+`<div class="body"><div class="dhead"><div class="a">🐱</div><div><b>Айбарыс</b><br><span>${e.step}</span></div></div>
      ${h}<div class="msg"><div class="a">🐱</div><div class="bubble">${e.b}</div></div><div class="steptag">— ${e.pr} —</div>${body}</div>
      <div class="foot"><button class="btn primary" id="ck" onclick="ck()" ${e.k==='s'?'':'disabled'}>${e.k==='s'?'Айттым ✓':'Жауап'}</button></div>`;
    screen.scrollTop=999;ans=false;sel=null;build=[];}
  window.pk=k=>{if(ans)return;sel=k;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));document.querySelector('.opt[data-k="'+k+'"]').classList.add('sel');document.getElementById('ck').disabled=false;};
  window.tb=k=>{if(ans)return;const e=list[i],c=document.getElementById('c'+k);if(c.classList.contains('used'))return;c.classList.add('used');build.push({k,w:e.bank[k]});rb();document.getElementById('ck').disabled=!build.length;};
  window.ub=p=>{if(ans)return;document.getElementById('c'+build[p].k).classList.remove('used');build.splice(p,1);rb();document.getElementById('ck').disabled=!build.length;};
  function rb(){document.getElementById('bd').innerHTML=build.map((x,p)=>`<button class="chip inbuild" onclick="ub(${p})">${x.w}</button>`).join('');}
  window.rc=()=>{document.getElementById('wv').textContent='▁▂▄▆█▆▄▂▁ запись… (заглушка)';document.getElementById('mic').style.background='#e0466a';document.getElementById('ck').disabled=false;};
  window.ck=()=>{const e=list[i];if(ans){i<list.length-1?(i++,draw()):complete(7,true);return;}
    let ok=true,my='';
    if(e.k==='c'){ok=sel===e.a;my=e.o[sel!=null?sel:e.a];document.querySelectorAll('.opt').forEach(o=>{const k=+o.dataset.k;if(k===e.a)o.classList.add('correct');if(k===sel&&!ok)o.classList.add('wrong');});}
    else if(e.k==='as'){ok=JSON.stringify(build.map(x=>x.w))===JSON.stringify(e.a);my=ok?build.map(x=>x.w).join(''):e.a.join('');}
    else my=e.t;
    hist.push({me:false,t:e.b});hist.push({me:true,t:my});ans=true;fb(ok,e.k==='s'?'Жарайсың!':(ok?'Дұрыс!':'Верный вариант показан'));
    const bt=document.getElementById('ck');bt.disabled=false;bt.textContent=i<list.length-1?'Әрі қарай →':'Завершить раздел ✓';};
  draw();
}

    <div class="gamecard" onclick="songList()"><div class="ic" style="background:linear-gradient(135deg,#7d6bff,#5B43E6)">🎵</div><div><b>Разбор песен</b><span>Текст с переводом, по строкам</span></div></div>
    <div class="gamecard" onclick="gamesList()"><div class="ic" style="background:linear-gradient(135deg,#f0997b,#e0466a)">🎮</div><div><b>Мини-игры</b><span>Вордли, на скорость, пары, пропуски</span></div></div>
    <div class="gamecard" onclick="wordsBank()"><div class="ic" style="background:linear-gradient(135deg,#5dcaa5,#20a86a)">📚</div><div><b>Слова</b><span>Твой личный словарь</span></div></div>
   </div>`;
  screen.scrollTop=0;
}

 {id:'uyde',title:'Үйде',artist:'Дархан Джузз',emoji:'🎧',locked:false},
 {id:'s2',title:'Менің Қазақстаным',artist:'Шәмші Қалдаяқов',emoji:'🎼',locked:true},
 {id:'s3',title:'Дала жыры',artist:'халық әні',emoji:'🎻',locked:true},
 {id:'s4',title:'Ана тілім',artist:'орындаушы',emoji:'🎤',locked:true},
];
// ⚠️ Текст песни защищён авторским правом — здесь только СТРУКТУРА для караоке-показа.
// Замени kz/ru плейсхолдеры на лицензированный текст и перевод построчно.
const LYRICS={
 uyde:{title:'Үйде',artist:'Дархан Джузз',lines:[
   {kz:'[строка 1 — вставь текст песни]',ru:'[перевод строки 1]'},
   {kz:'[строка 2 — вставь текст песни]',ru:'[перевод строки 2]'},

   {kz:'[строка 5 — вставь текст песни]',ru:'[перевод строки 5]'},
 ]}
};

  function draw(){

     <div class="playerbar">
       <div class="top"><div class="cover">🎧</div><div class="info"><b>${s.title}</b><span>${s.artist}</span></div>

     </div>

     <div class="note">⚠️ Текст песни — плейсхолдер (текст защищён авторским правом). Вставь лицензированный текст и перевод в массив LYRICS в коде.</div>

/* ---- Словарь ---- */
// Раздел «Слова» — упражнение с выбором перевода, карточки в стиле flashcard-приложений
// (крупное слово на цветной карточке + варианты перевода снизу, как в Reword).
const CARD_GRADIENTS=['linear-gradient(135deg,#7d6bff,#5B43E6)','linear-gradient(135deg,#ff9ecf,#e0466a)','linear-gradient(135deg,#5dcaa5,#1b9e6e)','linear-gradient(135deg,#ffcf7a,#e8a33d)'];
function shuffleWords(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function wordsBank(){
  const deck=shuffleWords(WORDS);
  let i=0,ans=false,sel=null,correctCount=0;
  function makeOptions(w){
    const wrongs=shuffleWords(WORDS.filter(x=>x.ru!==w.ru)).slice(0,2).map(x=>x.ru);
    return shuffleWords([w.ru,...wrongs]);
  }
  function draw(){
    const w=deck[i]; const options=makeOptions(w); const grad=CARD_GRADIENTS[i%CARD_GRADIENTS.length];
    screen.innerHTML=practiceHead('✦ Сөздер ✦')+segsWords(i+1,deck.length)+`<div style="padding:6px 18px 18px">
     <button class="hintbtn" style="margin-bottom:12px" onclick="openPractice()">‹ Назад к практике</button>
     <div class="flashcard" style="background:${grad}"><div class="fc-word">${w.kz}</div><div class="fc-sub">выбери перевод</div></div>
     ${options.map(o=>`<button class="opt" data-o="${o}" onclick="wpick('${o.replace(/'/g,"\\'")}')">${o}<span class="mark"></span></button>`).join('')}
     </div><div class="foot"><button class="btn primary" id="wck" onclick="wnext()" disabled>Тексеру</button></div>`;
    screen.scrollTop=0; ans=false; sel=null;
    window.__wordAnswer=w.ru;
  }
  function segsWords(c,t){let s='';for(let k=1;k<=t;k++)s+=`<div class="seg ${k<c?'done':(k===c?'cur':'')}"></div>`;return `<div class="prog">${s}</div><div class="counter" style="color:var(--muted)">${c} / ${t}</div>`;}
  window.wpick=(o)=>{ if(ans)return; sel=o; document.querySelectorAll('.opt').forEach(el=>el.classList.remove('sel')); document.querySelector('.opt[data-o="'+o+'"]').classList.add('sel'); document.getElementById('wck').disabled=false; };
  window.wnext=()=>{
    if(ans){ if(i<deck.length-1){i++;draw();} else {
        screen.innerHTML=practiceHead('✦ Готово ✦')+`<div class="done"><div class="big">📚</div><h2>Слова пройдены!</h2><p>Верно: ${correctCount} из ${deck.length}</p><div class="foot" style="position:static"><button class="btn primary" onclick="openPractice()">К практике</button></div></div>`;
      } return; }
    const correct=window.__wordAnswer, ok=sel===correct;
    if(ok)correctCount++;
    document.querySelectorAll('.opt').forEach(el=>{ if(el.dataset.o===correct)el.classList.add('correct'); if(el.dataset.o===sel&&!ok)el.classList.add('wrong'); });
    ans=true; fb(ok,ok?'Дұрыс!':'Дұрысы: '+correct);
    document.getElementById('wck').textContent= i<deck.length-1?'Әрі қарай →':'Завершить ✓';
  };
  draw();
}

/* ---- Мини-игры: хаб ---- */
function gamesList(){
  screen.innerHTML=practiceHead('✦ Мини-игры ✦')+`<div style="padding:14px 18px">
   <button class="hintbtn" style="margin-bottom:14px" onclick="openPractice()">‹ Назад к практике</button>
   <div class="gamecard" onclick="gameWordle()"><div class="ic" style="background:#5B43E6">🔤</div><div><b>Сөз (Вордли)</b><span>Угадай слово за 6 попыток</span></div></div>
   <div class="gamecard" onclick="gameSpeed()"><div class="ic" style="background:#e8a33d">⏱️</div><div><b>Жылдам</b><span>На скорость — 60 секунд</span></div></div>
   <div class="gamecard" onclick="gameMatch()"><div class="ic" style="background:#20a86a">🧩</div><div><b>Жұп тап</b><span>Собери пару слово-перевод</span></div></div>
   <div class="gamecard" onclick="gameCloze()"><div class="ic" style="background:#e0466a">✏️</div><div><b>Жетіспейтін сөз</b><span>Впиши пропущенное слово</span></div></div>
   </div>`;
  screen.scrollTop=0;
}

/* ---- Игра 1: Вордли ---- */
function gameWordle(){
  const ANSWER='ҚАЗАҚ'.split('');
  const KEYS=['Ә','Ғ','Қ','Ң','Ө','Ұ','Ү','Һ','І','А','Б','Д','Е','Ж','З','К','Л','М','Н','О','Р','С','Т','У'];
  let rows=[],cur='',keyState={},finished=false;
  function evalRow(guess){
    const g=guess.split(''); const res=Array(5).fill('gr'); const pool=ANSWER.slice();
    for(let i=0;i<5;i++) if(g[i]===ANSWER[i]){res[i]='g';pool[i]=null;}
    for(let i=0;i<5;i++){ if(res[i]==='g')continue; const idx=pool.indexOf(g[i]); if(idx>-1){res[i]='y';pool[idx]=null;} }
    g.forEach((l,i)=>{const st=res[i]; if(!keyState[l]||st==='g'||(st==='y'&&keyState[l]!=='g')) keyState[l]=st;});
    return res;
  }
  function draw(msg){
    let grid='';
    for(let r=0;r<6;r++){ const guess=rows[r]||(r===rows.length?cur:'');
      for(let c=0;c<5;c++){ const ch=guess[c]||''; let cls='';
        if(rows[r]){ const res=evalRow(rows[r]); cls=res[c]; }
        grid+=`<div class="wtile ${cls}">${ch}</div>`; } }
    let kb=KEYS.map(k=>`<button class="wkey ${keyState[k]||''}" ${finished?'disabled':''} onclick="wtype('${k}')">${k}</button>`).join('');
    screen.innerHTML=practiceHead('✦ Сөз ✦')+`<div style="padding:14px 18px;position:relative">
     <button class="hintbtn" style="margin-bottom:10px" onclick="gamesList()">‹ Назад к играм</button>
     <div class="qtext" style="text-align:center">Угадай слово из 5 букв</div>
     ${msg?`<div class="hintbox" style="text-align:center">${msg}</div>`:''}
     <div class="wgrid">${grid}</div>
     <div class="wkbrow">${kb}</div>
     <div class="wkbrow"><button class="wkey wide" ${finished?'disabled':''} onclick="wback()">⌫</button><button class="wkey wide" ${finished?'disabled':''} onclick="wsubmit()">OK</button></div>
     ${finished?`<button class="btn primary" style="margin-top:14px" onclick="gamesList()">К играм</button>`:''}
     </div>`;
    screen.scrollTop=0;
  }
  // ИСПРАВЛЕНО: раньше игра не останавливалась после победы/поражения — можно было
  // печатать дальше и получить противоречивые сообщения. Теперь после finished=true
  // клавиатура и OK/⌫ блокируются (disabled), показывается кнопка возврата.
  window.wtype=(k)=>{ if(finished)return; if(cur.length<5) cur+=k; draw(); };
  window.wback=()=>{ if(finished)return; cur=cur.slice(0,-1); draw(); };
  window.wsubmit=()=>{
    if(finished)return;
    if(cur.length<5){draw('Слово из 5 букв!');return;}
    rows.push(cur); const won=cur===ANSWER.join(''); cur='';
    if(won){finished=true;draw();fb(true,'Дұрыс! Жеңдің! 🎉');}
    else if(rows.length>=6){finished=true;draw();fb(false,'Дұрыс сөз: ҚАЗАҚ');}
    else draw();
  };
  draw();
}

/* ---- Игра 2: На скорость ---- */
function gameSpeed(){
  function shuffleArr(a){a=[...new Set(a)];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
  const pool=[...LETTERS.map(l=>({q:l.word,a:l.ru,pool:LETTERS.map(x=>x.ru)})),
              ...WORDS.map(w=>({q:w.kz,a:w.ru,pool:WORDS.map(x=>x.ru)}))];
  let score=0,timeLeft=60,timer=null,curQ=null;
  function nextQ(){ const base=pool[Math.floor(Math.random()*pool.length)];
    // ИСПРАВЛЕНО: раньше перемешивали ВСЕ варианты (включая верный) и брали первые 3 —
    // верный ответ мог не попасть в список. Теперь верный ответ добавляется ГАРАНТИРОВАННО,
    // перемешиваются только 2 случайных неверных + сам порядок показа.
    const wrongs=shuffleArr(base.pool.filter(x=>x!==base.a)).slice(0,2);
    curQ={q:base.q,a:base.a,options:shuffleArr([base.a,...wrongs])}; }
  function draw(){
    screen.innerHTML=practiceHead('✦ Жылдам ✦')+`<div style="padding:14px 18px;position:relative">
     <div class="scoretag">⭐ ${score}</div>
     <button class="hintbtn" style="margin:34px 0 10px" onclick="stopSpeed()">‹ Завершить</button>
     <div class="timerbar"><div class="f" style="width:${timeLeft/60*100}%"></div></div>
     <div class="qtext" style="text-align:center">Что значит «${curQ.q}»?</div>
     ${curQ.options.map(o=>`<button class="opt" onclick="answerSpeed('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
     </div>`;
    screen.scrollTop=0;
  }
  window.answerSpeed=(o)=>{ if(o===curQ.a){score++;fb(true,'+1');} else fb(false,'Дұрыс: '+curQ.a); nextQ(); draw(); };
  window.stopSpeed=()=>{ clearInterval(timer); gamesList(); };
  nextQ(); draw();
  timer=setInterval(()=>{ timeLeft--;
    if(timeLeft<=0){clearInterval(timer);
      screen.innerHTML=practiceHead('✦ Жылдам ✦')+`<div class="done"><div class="big">⏱️</div><h2>Уақыт бітті!</h2><p>Результат: ${score} очков</p><div class="foot" style="position:static"><button class="btn primary" onclick="gamesList()">К играм</button></div></div>`;
    } else draw();
  },1000);
}

/* ---- Игра 3: Собери пару ---- */
function gameMatch(){
  // ИСПРАВЛЕНО: было слабое перемешивание sort(()=>Math.random()-0.5) — даёт неровное
  // распределение карточек. Заменено на нормальный алгоритм Фишера-Йетса.
  function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
  const src=[...LETTERS.slice(0,4).map(l=>({kz:l.word,ru:l.ru})),...WORDS.slice(0,2)];
  let cards=[]; src.forEach((s,i)=>{cards.push({id:i,text:s.kz,pair:i,side:'kz'});cards.push({id:i+100,text:s.ru,pair:i,side:'ru'});});
  cards=shuffleArr(cards);
  let sel=null,doneCount=0,lock=false;
  function draw(){
    screen.innerHTML=practiceHead('✦ Жұп тап ✦')+`<div style="padding:14px 18px">
     <button class="hintbtn" style="margin-bottom:10px" onclick="gamesList()">‹ Назад к играм</button>
     <div class="qtext" style="text-align:center">Найди пару: слово и перевод</div>
     <div class="matchgrid2">${cards.map(c=>`<div class="mcard" id="mc${c.id}" onclick="mpick(${c.id})">${c.text}</div>`).join('')}</div>
     </div>`;
    screen.scrollTop=0;
  }
  // ИСПРАВЛЕНО: при неверной паре раньше визуально менялась только ПЕРВАЯ карточка —
  // вторая никак не показывала, что её вообще нажали. Теперь обе карточки на миг
  // подсвечиваются красным (класс wrong), и ввод блокируется на это время (lock).
  window.mpick=(id)=>{
    if(lock)return;
    const el=document.getElementById('mc'+id); if(el.classList.contains('done'))return;
    const card=cards.find(c=>c.id===id);
    if(sel===null){ sel=card; el.classList.add('sel'); return; }
    if(sel.id===id) return;
    if(sel.pair===card.pair && sel.side!==card.side){
      el.classList.add('done'); document.getElementById('mc'+sel.id).classList.add('done');
      doneCount++; fb(true,'Дұрыс!'); sel=null;
      if(doneCount===src.length){ setTimeout(()=>{screen.innerHTML=practiceHead('✦ Жұп тап ✦')+`<div class="done"><div class="big">🎉</div><h2>Бәрі дұрыс!</h2><p>Все пары найдены</p><div class="foot" style="position:static"><button class="btn primary" onclick="gamesList()">К играм</button></div></div>`;},600); }
    } else {
      lock=true; fb(false,'Попробуй ещё');
      const selEl=document.getElementById('mc'+sel.id);
      el.classList.add('wrong'); selEl.classList.add('wrong');
      setTimeout(()=>{ el.classList.remove('wrong'); selEl.classList.remove('sel','wrong'); sel=null; lock=false; },500);
    }
  };
  draw();
}

/* ---- Игра 4: Пропущенное слово ---- */
function gameCloze(){
  function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
  // ИСПРАВЛЕНО: раньше верный ответ хранился фиксированным индексом (a:0/a:1) и всегда
  // стоял на одной позиции — можно было угадывать по месту, а не по смыслу.
  // Теперь верное слово храним текстом (correct), а порядок вариантов перемешиваем при показе.
  const RAW=[
   {sentence:'Бұл — қызыл ___.',options:['алма','үй','тау'],correct:'алма',hint:'яблоко'},
   {sentence:'Мен ___ баламын.',options:['үлкен','кіші','жаңа'],correct:'кіші',hint:'маленький'},
   {sentence:'Ол ___ ішінде тұр.',options:['үй','жол','аспан'],correct:'үй',hint:'дом'},
   {sentence:'Біз ___ келдік.',options:['ертең','кеше','қазір'],correct:'кеше',hint:'вчера'},
   {sentence:'Сен ___ жақсы көресің бе?',options:['шай','тас','түс'],correct:'шай',hint:'чай'},
  ];
  const list=RAW.map(q=>{ const opts=shuffleArr(q.options); return {sentence:q.sentence,hint:q.hint,options:opts,a:opts.indexOf(q.correct)}; });
  let i=0,ans=false,sel=null;
  function draw(){ const e=list[i];
    screen.innerHTML=practiceHead('✦ Жетіспейтін сөз ✦')+`<div style="padding:14px 18px">
     <button class="hintbtn" style="margin-bottom:10px" onclick="gamesList()">‹ Назад к играм</button>
     <div class="qtext" style="text-align:center">${e.sentence}</div>
     <div class="qhint" style="text-align:center">Подсказка: ${e.hint}</div>
     ${e.options.map((o,k)=>`<button class="opt" data-k="${k}" onclick="cpick(${k})">${o}<span class="mark"></span></button>`).join('')}
     </div><div class="foot"><button class="btn primary" id="cck" onclick="cnext()" disabled>Тексеру</button></div>`;
    screen.scrollTop=0; ans=false; sel=null;
  }
  window.cpick=(k)=>{ if(ans)return; sel=k; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); document.querySelector('.opt[data-k="'+k+'"]').classList.add('sel'); document.getElementById('cck').disabled=false; };
  window.cnext=()=>{
    if(ans){ i<list.length-1? (i++,draw()) : (screen.innerHTML=practiceHead('✦ Дайын ✦')+`<div class="done"><div class="big">✅</div><h2>Раунд завершён!</h2><div class="foot" style="position:static"><button class="btn primary" onclick="gamesList()">К играм</button></div></div>`); return; }
    const e=list[i],ok=sel===e.a;
    document.querySelectorAll('.opt').forEach(o=>{const k=+o.dataset.k; if(k===e.a)o.classList.add('correct'); if(k===sel&&!ok)o.classList.add('wrong');});
    ans=true; fb(ok,ok?'Дұрыс!':'Дұрысы: '+e.options[e.a]);
    document.getElementById('cck').textContent= i<list.length-1?'Әрі қарай →':'Завершить ✓';
  };
  draw();
}

renderMap();
</script>
